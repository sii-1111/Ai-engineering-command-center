services:\n  postgres:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_DB: command_center\n      POSTGRES_USER: command_center\n      POSTGRES_PASSWORD: command_center\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    healthcheck:\n      test: ["CMD-SHELL", "pg_isready -U command_center -d command_center"]\n      interval: 5s\n      timeout: 5s\n      retries: 10\n  redis:\n    image: redis:7-alpine\n    volumes:\n      - redis_data:/data\n  api:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    environment:\n      DATABASE_URL: postgresql://command_center:command_center@postgres:5432/command_center\n      LANGGRAPH_STRICT_MSGPACK: "true"\n      GITHUB_TOKEN: ${GITHUB_TOKEN:-}\n      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}\n      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}\n      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}\n    depends_on:\n      postgres:\n        condition: service_healthy\n    ports:\n      - "8000:8000"\n  web:\n    build:\n      context: ./apps/web\n      dockerfile: Dockerfile\n    environment:\n      NEXT_PUBLIC_API_URL: http://localhost:8000\n    depends_on:\n      - api\n    ports:\n      - "3000:3000"\nvolumes:\n  postgres_data:\n  redis_data:\n