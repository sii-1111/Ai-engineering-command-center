services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: command_center
      POSTGRES_USER: command_center
      POSTGRES_PASSWORD: command_center
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U command_center -d command_center"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://command_center:command_center@postgres:5432/command_center
      REDIS_URL: redis://redis:6379/0
      LANGGRAPH_STRICT_MSGPACK: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.7-flash,gemini-3.5-flash-lite}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      LOCAL_REPOSITORY_ROOT: ${LOCAL_REPOSITORY_ROOT:-.data/repositories}
      LOCAL_RETRIEVAL_INDEX: ${LOCAL_RETRIEVAL_INDEX:-.data/repository-index.jsonl}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "core.workers.task_worker"]
    environment:
      DATABASE_URL: postgresql://command_center:command_center@postgres:5432/command_center
      REDIS_URL: redis://redis:6379/0
      LANGGRAPH_STRICT_MSGPACK: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.7-flash,gemini-3.5-flash-lite}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      LOCAL_REPOSITORY_ROOT: ${LOCAL_REPOSITORY_ROOT:-.data/repositories}
      LOCAL_RETRIEVAL_INDEX: ${LOCAL_RETRIEVAL_INDEX:-.data/repository-index.jsonl}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
volumes:
  postgres_data:
  redis_data:
