[project]
name = "ai-engineering-command-center"
version = "0.1.0"
description = "Agentic AI platform for engineering investigation, tool use, verification, and human approval."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115","uvicorn[standard]>=0.30","pydantic>=2.9","pydantic-settings>=2.5","langgraph>=0.2","langgraph-checkpoint-postgres>=3.0.1","langchain-core>=0.3","mcp>=1.2","httpx>=0.27","openai>=1.50"]
[project.optional-dependencies]
dev = ["pytest>=8.3","pytest-asyncio>=0.24","ruff>=0.7","mypy>=1.13"]
[tool.setuptools.packages.find]
include = ["agents*","apps*","core*","tooling*"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
